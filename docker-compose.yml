services:
  db:
    image: postgres:16-alpine
    container_name: movie_network_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_network}
      POSTGRES_USER: ${POSTGRES_USER:-movie_network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie_network_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie_network_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movie_network} -d ${POSTGRES_DB:-movie_network}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: movie_network_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: celery -A movie_network worker -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: movie_network.settings.dev
    depends_on:
      - db
      - redis
    profiles:
      - worker

  beat:
    build: .
    command: celery -A movie_network beat -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: movie_network.settings.dev
    depends_on:
      - db
      - redis
    profiles:
      - worker

volumes:
  movie_network_pgdata:
