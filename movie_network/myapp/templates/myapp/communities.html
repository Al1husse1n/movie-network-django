{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Communities</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'myapp/communities.css' %}">
</head>
<body>

<main class="content">
    <h2 class="page-title">Find Communities</h2>

    <div class="search-row">
        <input
            type="text"
            id="searchInput"
            placeholder="Search communities..."
            class="search-input"
        >
        <button id="searchBtn" class="search-btn">Search</button>
    </div>

    <!-- Placeholder / Alternative text -->
    <p id="placeholderText" class="placeholder-text">
        🔍 Search for communities to see results
    </p>

    <div id="communityResults" class="community-grid"></div>
</main>

<script src="{% static 'myapp/communities.js' %}"></script>
</body>
</html>
