{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBird | Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'myapp/editProfile.css'%}">
</head>
<body class="bg-dark-custom text-white">

    <nav class="navbar border-bottom border-secondary py-3">
        <div class="container">
            <span class="navbar-brand fw-bold fs-3 text-green">GreenBird</span>
            
            
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            
            <div class="col-md-3 d-none d-md-block">
                <ul class="list-unstyled sidebar-nav" id="nav-bar">
                    <li class="mb-4"><a href="{% url 'myapp:home' %}">Home</a></li>
                    <li class="mb-4"><a href="#">Explore</a></li>
                    <li class="mb-4"><a href="#">Notifications</a></li>
                    <li class="mb-4"><a href="#">Messages</a></li>
                    <li class="mb-4 active-link"><a href="{% url 'myapp:profile' %}">Profile</a></li>
                </ul>
            </div>

            <div class="col-md-7 col-lg-6">
                <div class="card bg-card-custom border-0 shadow-lg rounded-4">
                    <div class="card-body p-4">
                        <h3 class="card-title fw-bold mb-4" id="edit-profile-label">Edit Profile</h3>
                        
                        <form id="editProfileForm">
                            <div class="text-center mb-4">
                                <div class="profile-preview-wrapper mx-auto mb-3">
                                    <img id="previewImg" src="" alt="" class="rounded-circle img-thumbnail bg-dark">
                                </div>
                                <label for="profilePic" class="btn btn-sm btn-outline-secondary rounded-pill">Change Photo</label>
                                <input type="file" id="profilePic" accept="image/*" class="d-none">
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label text-secondary small">Username</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white" id="username" placeholder="@username">
                                <div id="usernameError" class="text-danger small mt-1 d-none">Username is required.</div>
                            </div>

                            <div class="mb-4">
                                <label for="bio" class="form-label text-secondary small">Bio</label>
                                <textarea class="form-control bg-dark border-secondary text-white" id="bio" rows="4" placeholder="Tell the world about yourself..."></textarea>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="button" id="cancelBtn" class="btn btn-link text-secondary text-decoration-none px-4">Cancel</button>
                                <button type="submit" class="btn btn-green rounded-pill px-5 fw-bold">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'myapp/editProfile.js'%}"></script>
</body>
</html>
