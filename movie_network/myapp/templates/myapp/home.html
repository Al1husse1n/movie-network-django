{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBird Home</title>
    <link rel="stylesheet" href="{% static 'myapp/home.css' %}">
</head>
<body>
    <!-- Top bar -->
    <header class="topbar">
    <!-- changed: menuToggle moved to left before brand -->
    <button type="button" id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar-left" style="margin-right:12px">☰</button> <!-- changed: type=button so it won't submit forms -->
    <div class="brand">GreenBird</div>
    <nav class="top-actions">
        <form method="POST" action="{% url 'myapp:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn small">Logout</button>
        </form>
    </nav>
</header>

    <main class="container">
        <!-- Left menu -->
        <aside id="sidebar-left" class="sidebar-left left"> <!-- unchanged markup; id used by mobile toggle -->
            <ul class="menu">
                <li class="active"><a href="#">Home</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Notifications</a></li>
                <li><a href="#">Messages</a></li>
                <li><a href="{% url 'myapp:profile' %}" class="active">Profile</a></li>
            </ul>
        </aside>

        <!-- Feed -->
        <section class="feed">

            <!-- Composer -->
            <div class="composer card">
                <form id="composeForm" method="POST">
                    {% csrf_token %}
                    <textarea id="composeInput" name="compose-post" maxlength="280" placeholder="What's happening?" rows="3"></textarea>
                    <div class="composer-row">
                        <div class="composer-actions">
                            <span id="charCount">280</span>
                            <span id="checkbox-spoiler">
                                <input type="checkbox" value="spoiler" id="spoiler">
                                <label for="spoiler">Spoiler</label>
                            </span>
                        </div>
                        <div>
                            <button type="submit" name="submit" value="post" class="btn" id="post-btn">Post</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="community-dropdown card">                                                                                                           
            <form method="POST" id="communityForm">
                {% csrf_token %}
                <select name="community" id="communitySelect" aria-label="Select community" title="Select community"> <!-- changed: add accessible name -->
                    <option value="" disabled selected>Select a community</option>
                    {% for community in communities %}
                        <option value="{{ community.id }}">{{ community.name }}</option>
                    {% endfor %}
                </select>
             
            </form>
          </div>
            <!-- Timeline --> 
            <div id="timeline">
            </div>
        </section>

        <!-- Right sidebar -->
        <aside class="right">
            <div class="trends card">
                <h3>Trends for you</h3>
                <ul>
                    <li>#GreenAI</li>
                    <li>#OpenSource</li>
                    <li>#Design</li>
                </ul>
            </div>
        </aside>
    </main>

    <!-- changed: overlay used to dim content and close the aside on mobile -->
    <div id="asideOverlay" aria-hidden="true"></div>
    <script src="{% static 'myapp/home.js' %}"></script>
</body>
</html>
