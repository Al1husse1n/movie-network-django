{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'myapp/login.css' %}">
    <title>Login</title>
</head>
<body>
    {% block body %}
    <header class="log-in col-6 offset-6">
        <a href="{%url 'myapp:signup'%}">Sign up</a>
    </header>
    <div class="col-8 offset-2" id="container">
        <form action="#" method="post" class="needs-validation row gy-2" novalidate> 
            {% csrf_token %}
            <div class="form-floating">
                {{form.username}} 
                <label for="id_username" id="label1">username</label>
                <div class="invalid-feedback">
                    Please enter a valid username.
                </div>
            </div>
            <div class="form-floating">
                {{form.password}}
                <label for="id_password" id="label2">Password</label>
                <div class="invalid-feedback">
                    Please enter a valid password.
                </div>
            </div>  
            <button type="submit" id="log-in">Log in</button>
        </form>
    </div>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')

            Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
            })
        })()
    </script>
    {% endblock %}
</body>
</html>
