{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watchlist</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'myapp/watchlist.css' %}" />
</head>

<body>
  <!-- Main container -->
  <main class="container my-5">

    <!-- Page Header -->
    <header class="mb-4">
      <h2 class="page-title">My Watchlist</h2>
      <p class="text-muted">
        Movies and series you plan to watch later
      </p>
    </header>

    <!-- Empty state (shown when watchlist is empty) -->
    <section id="emptyState" class="empty-state text-center d-none">
      <p class="fs-5 mb-2">🎬 Your watchlist is empty</p>
      <p class="text-muted">
        Start adding movies or series to see them here.
      </p>
    </section>

    <!-- Watchlist Grid -->
    <section id="watchlistGrid" class="row g-4">
      <!-- Cards are injected here using JavaScript -->
    </section>

  </main>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Custom JS -->
  <script src="{% static 'myapp/watchlist.js' %}"></script>
</body>
</html>
