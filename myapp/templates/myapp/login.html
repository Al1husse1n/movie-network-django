{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'myapp/login.css' %}">
    <title>Login</title>
</head>
<body>
    {% block body %}
    <header class="log-in col-6 offset-6">
        <a href="{%url 'myapp:signup'%}">Sign up</a>
    </header>
    <div class="col-8 offset-2" id="container">
        <div id="poster">
             <img src=""  id="poster-image">
        </div>
        <form action="#" method="post" class="needs-validation row gy-2" novalidate>
            {% csrf_token %}
            <div class="form-floating">
                {{form.username}}
                <label for="id_username" id="label1">username</label>
                <div class="invalid-feedback">
                    Please enter a valid username.
                </div>
            </div>
            <div class="form-floating">
                {{form.password}}
                <label for="id_password" id="label2">Password</label>
                <div class="invalid-feedback">
                    Please enter a valid password.
                </div>
            </div>
            <button type="submit" id="log-in">Log in</button>
        </form>
    </div>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')

            Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
            })
        })()
        document.addEventListener('DOMContentLoaded', function() {
            const posterImage = document.getElementById('poster-image');

            function getRandomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }
            const imagePaths = [
                "{% static 'myapp/images/1.jpg' %}",
                "{% static 'myapp/images/2.jpg' %}",
                "{% static 'myapp/images/3.jpg' %}",
                "{% static 'myapp/images/4.jpg' %}",
                "{% static 'myapp/images/5.jpg' %}",
                "{% static 'myapp/images/6.jpg' %}",
                "{% static 'myapp/images/7.jpg' %}",
                "{% static 'myapp/images/8.jpg' %}",
                "{% static 'myapp/images/9.jpg' %}",
                "{% static 'myapp/images/10.jpg' %}",
                "{% static 'myapp/images/11.jpg' %}",
                "{% static 'myapp/images/12.jpg' %}",
                "{% static 'myapp/images/13.jpg' %}",
                "{% static 'myapp/images/14.jpg' %}",
                "{% static 'myapp/images/15.jpg' %}",
                "{% static 'myapp/images/16.jpg' %}",
                "{% static 'myapp/images/17.jpg' %}",
                "{% static 'myapp/images/18.jpg' %}"
            ];


            const randomIndex = getRandomInt(0, 17);
            posterImage.src = imagePaths[randomIndex];

            posterImage.onerror = function() {
                console.error('Failed to load image:', this.src);
                this.src = imagePaths[0];
            };
        });
    </script>
    {% endblock %}
</body>
</html>
