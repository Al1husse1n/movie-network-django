{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'myapp/signUp.css' %}">
  <title>Sign-up</title>
</head>
<body>
{% block body %}
  <header class="sign-up col-6 offset-6">
    <a href="{% url 'myapp:login' %}">Log in</a>
  </header>
  <div id="create-label">Create an account</div>
  <div class="" id="container">
    <form action="#" method="post" class="row gy-3 needs-validation" novalidate> 
      {% csrf_token %}
      <div id="username" class="form-floating">
        {{form.username}}
        <label for="id_username">username</label>
        <div class="invalid-feedback">
          Please enter a valid username.
        </div>
      </div>
      <div id="email" class="form-floating">
        {{form.email}}
        <label for="id_email">Email</label>
        <div class="invalid-feedback">
          Please enter a valid Email.
        </div>
      </div>
      <div id="password" class="form-floating">
        {{form.password}}
        <label for="id_password">password</label>
        <div class="invalid-feedback">
          Please enter a valid password.
        </div>
      </div>
      <button type="submit" id="sign-up">Sign up</button>
    </form>
  </div>

  <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')

            Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
            })
        })()
    </script>
{% endblock %}
</body>
</html>
